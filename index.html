<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <title>♡ NATCHAYAKAN | Portfolio ♡</title>


    <style>

        /* =====================================================
           💚 BASIC
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: #47766c;

            min-height: 100vh;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    #d9f8ef 0%,
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 65%,
                    #e3f9f3 0%,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #f9fffd,
                    #ffffff 45%,
                    #effbf7
                );
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           🎀 HEADER
        ===================================================== */

        header {
            position: sticky;

            top: 0;

            z-index: 999;

            width: 100%;

            padding: 18px 24px;

            background:
                rgba(255,255,255,0.92);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid #dcefe9;

            box-shadow:
                0 5px 25px
                rgba(78,145,130,0.08);
        }


        .navbar {

            max-width: 1250px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           ♡ LOGO
        ===================================================== */

        .logo {

            text-decoration: none;

            color: #519987;

            font-size: 32px;

            font-weight: 800;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        .logo-heart {

            font-size: 40px;

            font-weight: 400;

            margin-right: 5px;
        }


        /* =====================================================
           🌷 NAVIGATION
        ===================================================== */

        nav {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            overflow-x: auto;

            scrollbar-width: none;
        }


        nav::-webkit-scrollbar {
            display: none;
        }


        nav a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: #607b75;

            font-size: 17px;

            font-weight: 700;

            padding: 12px 19px;

            border-radius: 35px;

            transition: 0.3s ease;

            white-space: nowrap;
        }


        nav a:hover {

            background: #e2f7f0;

            color: #438a78;

            transform:
                translateY(-2px);
        }


        nav a.active {

            background: #c9efe4;

            color: #438f7c;

            box-shadow:
                0 7px 18px
                rgba(90,170,150,0.14);
        }


        /* =====================================================
           🌿 MAIN
        ===================================================== */

        main {

            position: relative;

            min-height: calc(100vh - 90px);

            padding:
                45px 20px 80px;

            overflow: hidden;
        }


        .container {

            position: relative;

            z-index: 5;

            width: min(1100px, 100%);

            margin: auto;

            text-align: center;
        }
