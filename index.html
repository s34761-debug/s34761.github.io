    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Prompt", sans-serif;
            background: #fffdfd;
            color: #557568;
        }


        /* =================================
           หน้าแรก HOME
        ================================= */

        .home {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
            overflow: hidden;

            padding: 70px 20px 50px;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(220, 246, 233, 0.8),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 226, 237, 0.6),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f8fffb 50%,
                    #e9f8ef 100%
                );
        }


        /* =================================
           ของตกแต่งด้านบน
        ================================= */

        .decor-top {
            position: absolute;

            top: 30px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 22px;

            letter-spacing: 3px;

            opacity: 0.85;

            animation: floating 3s ease-in-out infinite;
        }


        /* =================================
           กล่องเนื้อหา
        ================================= */

        .home-container {
            width: 90%;
            max-width: 1050px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 80px;

            padding: 60px;

            background: rgba(255, 255, 255, 0.82);

            border: 2px solid #e2f4e9;

            border-radius: 40px;

            box-shadow:
                0 20px 50px rgba(105, 169, 137, 0.12);

            backdrop-filter: blur(12px);

            position: relative;

            z-index: 2;
        }


        /* =================================
           รูปโปรไฟล์
        ================================= */

        .profile-area {
            position: relative;

            flex-shrink: 0;
        }

        .profile-frame {

            width: 280px;
            height: 280px;

            padding: 9px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #bdebd2,
                    #f8dce7
                );

            box-shadow:
                0 15px 35px rgba(102, 169, 136, 0.20);

            animation: floating 4s ease-in-out infinite;
        }

        .profile-frame img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 7px solid #ffffff;
        }


        /* =================================
           ของตกแต่งรอบรูป
        ================================= */

        .profile-decor {

            position: absolute;

            font-size: 30px;

            z-index: 3;
        }

        .decor-heart {
            top: -15px;
            right: 10px;
        }

        .decor-bear {
            bottom: 5px;
            left: -20px;
        }


        /* =================================
           ข้อความ
        ================================= */

        .home-text {
            text-align: left;

            max-width: 520px;
        }

        .small-title {

            color: #86bda0;

            font-size: 16px;

            font-weight: 600;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }

        .home-text h1 {

            color: #557568;

            font-size: 43px;

            line-height: 1.4;

            font-weight: 600;

            margin-bottom: 18px;
        }

        .home-text h1 span {

            color: #7fc19e;

            position: relative;
        }

        .home-text h1 span::after {

            content: "♡";

            position: absolute;

            font-size: 20px;

            color: #e6a9bc;

            top: -5px;

            right: -27px;
        }


        /* =================================
           คำแนะนำ
        ================================= */

        .intro {

            color: #82958d;

            font-size: 19px;

            line-height: 1.8;

            margin-bottom: 28px;
        }


        /* =================================
           ปุ่ม
        ================================= */

        .about-btn {

            display: inline-block;

            padding: 13px 28px;

            border-radius: 30px;

            background: #9bd6b7;

            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: 500;

            box-shadow:
                0 8px 18px rgba(103, 179, 137, 0.22);

            transition: all 0.3s ease;
        }

        .about-btn:hover {

            background: #83c9a4;

            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(103, 179, 137, 0.28);
        }


        /* =================================
           ของตกแต่งด้านล่าง
        ================================= */

        .cute-decoration {

            margin-top: 35px;

            font-size: 24px;

            letter-spacing: 5px;

            text-align: center;

            color: #a8cdb8;

            animation: floating 3.5s ease-in-out infinite;
        }


        /* =================================
           ของตกแต่งพื้นหลัง
        ================================= */

        .bg-decoration {

            position: absolute;

            pointer-events: none;

            opacity: 0.65;

            font-size: 30px;
        }

        .bg-1 {
            top: 20%;
            left: 6%;
        }

        .bg-2 {
            top: 70%;
            right: 7%;
        }

        .bg-3 {
            top: 13%;
            right: 12%;
            font-size: 22px;
        }

        .bg-4 {
            bottom: 12%;
            left: 13%;
            font-size: 23px;
        }


        /* =================================
           Animation
        ================================= */

        @keyframes floating {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }
        }


        /* =================================
           RESPONSIVE - TABLET
        ================================= */

        @media (max-width: 900px) {

            .home-container {

                gap: 45px;

                padding: 45px;
            }

            .profile-frame {

                width: 240px;
                height: 240px;
            }

            .home-text h1 {

                font-size: 36px;
            }
        }


        /* =================================
           RESPONSIVE - MOBILE
        ================================= */

        @media (max-width: 700px) {

            .home {

                padding: 90px 15px 40px;
            }

            .decor-top {

                top: 25px;

                font-size: 16px;

                letter-spacing: 1px;

                padding: 0 10px;
            }

            .home-container {

                width: 94%;

                flex-direction: column;

                gap: 30px;

                padding: 40px 22px;

                border-radius: 30px;

                text-align: center;
            }

            .profile-frame {

                width: 210px;
                height: 210px;
            }

            .profile-decor {

                font-size: 25px;
            }

            .decor-heart {

                top: -10px;
                right: 0;
            }

            .decor-bear {

                bottom: 0;
                left: -12px;
            }

            .home-text {

                text-align: center;
            }

            .small-title {

                font-size: 13px;

                letter-spacing: 0;
            }

            .home-text h1 {

                font-size: 29px;

                line-height: 1.5;
            }

            .home-text h1 span::after {

                display: none;
            }

            .intro {

                font-size: 16px;

                line-height: 1.8;
            }

            .about-btn {

                font-size: 15px;

                padding: 12px 25px;
            }

            .cute-decoration {

                font-size: 18px;

                letter-spacing: 2px;

                padding: 0 10px;
            }

            .bg-decoration {

                font-size: 22px;
            }
        }


        /* =================================
           MOBILE เล็ก
        ================================= */

        @media (max-width: 400px) {

            .profile-frame {

                width: 180px;
                height: 180px;
            }

            .home-text h1 {

                font-size: 25px;
            }

            .cute-decoration {

                font-size: 15px;
            }
        }

    </style>
</head>

            background: #9bd6b7;

            border-radius: 18px;

            box-shadow:
                0 15px 35px
                rgba(102, 169, 136, 0.25);

            animation:
                heartFloat 4s ease-in-out infinite;
        }


        /* วงกลมด้านบนของหัวใจ */

        .profile-heart::before,
        .profile-heart::after {

            content: "";

            position: absolute;

            width: 230px;

            height: 230px;

            background: #9bd6b7;

            border-radius: 50%;
        }


        .profile-heart::before {

            top: -115px;

            left: 0;
        }


        .profile-heart::after {

            top: 0;

            left: 115px;
        }



        /* =====================================
           รูปด้านในหัวใจ
        ===================================== */

        .profile-heart img {

            position: absolute;

            top: 0;

            left: 0;

            width: 230px;

            height: 230px;

            object-fit: cover;

            z-index: 5;

            border: 8px solid white;

            border-radius: 18px;

            transform:
                rotate(45deg)
                scale(1.38);

            clip-path: polygon(

                50% 100%,

                0% 50%,

                0% 25%,

                5% 12%,

                15% 4%,

                28% 0%,

                40% 2%,

                50% 12%,

                60% 2%,

                72% 0%,

                85% 4%,

                95% 12%,

                100% 25%,

                100% 50%

           ANIMATION
        ===================================== */

        @keyframes floating {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }
        }
