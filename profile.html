<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ข้อมูลส่วนตัว | NATCHAYAKAN</title>

    <style>

        /* =========================================
           🌷 COLOR THEME
        ========================================= */

        :root {
            --mint-dark: #4f8f7b;
            --mint: #8fcfc0;
            --mint-soft: #cdeee5;
            --mint-light: #e9f8f4;
            --mint-pale: #f5fcfa;

            --white: #ffffff;

            --text-dark: #31443e;
            --text: #53645f;
            --text-light: #7c8d87;

            --border: #d8eee7;

            --shadow: 0 12px 35px rgba(70, 130, 112, 0.10);
            --shadow-hover: 0 18px 40px rgba(70, 130, 112, 0.17);
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--text-dark);

            min-height: 100vh;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(143, 207, 192, 0.25),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 35%,
                    rgba(205, 238, 229, 0.35),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f3fcf9,
                    #ffffff,
                    #eefaf7
                );
        }


        /* =========================================
           🌷 BACKGROUND DECORATION
        ========================================= */

        body::before {
            content: "🌷";
            position: fixed;
            left: -15px;
            top: 150px;
            font-size: 75px;
            opacity: 0.12;
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "🪽";
            position: fixed;
            right: -10px;
            bottom: 100px;
            font-size: 80px;
            opacity: 0.12;
            transform: rotate(12deg);
            pointer-events: none;
            z-index: -1;
        }


        /* =========================================
           🎀 HEADER
        ========================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255,255,255,0.94);

            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 5px 20px rgba(70,130,112,0.06);
        }

        .header-inner {
            max-width: 1200px;

            margin: auto;

            padding: 18px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;
        }


        /* =========================================
           💚 BRAND
        ========================================= */

        .brand {
            color: var(--mint-dark);

            font-size: 24px;

            font-weight: 900;

            letter-spacing: 2px;

            white-space: nowrap;
        }

        .brand::before {
            content: "♡ ";
            color: var(--mint);
        }


        /* =========================================
           🧭 NAVIGATION
        ========================================= */

        nav {
            display: flex;

            align-items: center;

            gap: 7px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            text-decoration: none;

            color: var(--text);

            font-size: 16px;

            font-weight: 700;

            padding: 13px 17px;

            border-radius: 25px;

            white-space: nowrap;

            transition: 0.3s ease;
        }

        nav a:hover {
            background: var(--mint-light);

            color: var(--mint-dark);

            transform: translateY(-2px);
        }

        nav a.active {
            background: var(--mint-soft);

            color: var(--mint-dark);

            box-shadow:
                0 6px 18px rgba(79,143,123,0.10);
        }


        /* =========================================
           🌿 MAIN
        ========================================= */

        main {
            width: min(1050px, 92%);

            margin: auto;

            padding: 65px 0 90px;
        }


        /* =========================================
           🌷 PAGE HEADING
        ========================================= */

        .page-heading {
            text-align: center;

            margin-bottom: 50px;
        }

        .page-label {
            display: inline-block;

            padding: 10px 28px;

            border-radius: 50px;

            background: var(--mint-light);

            border: 1px solid var(--mint-soft);

            color: var(--mint-dark);

            font-size: 14px;

            font-weight: 900;

            letter-spacing: 2px;

            margin-bottom: 20px;
        }

        .page-title {
            font-size: clamp(40px, 7vw, 65px);

            font-weight: 900;

            line-height: 1.2;

            color: var(--text-dark);

            margin-bottom: 15px;
        }

        .page-title::before {
            content: "♡ ";
            color: var(--mint);
        }

        .page-title::after {
            content: " ♡";
            color: var(--mint);
        }

        .page-description {
            max-width: 700px;

            margin: auto;

            color: var(--text-light);

            font-size: 18px;

            line-height: 1.8;
        }


        /* =========================================
           🌿 SECTION CARD
        ========================================= */

        .section-card {
            background: rgba(255,255,255,0.96);

            border: 1.5px solid var(--border);

            border-radius: 38px;

            padding: 42px;

            margin-bottom: 32px;

            box-shadow: var(--shadow);

            position: relative;

            overflow: hidden;

            transition: 0.35s ease;
        }

        .section-card:hover {
            box-shadow: var(--shadow-hover);

            transform: translateY(-2px);
        }

        .section-card::before {
            content: "✦";

            position: absolute;

            top: 20px;

            right: 30px;

            color: var(--mint);

            font-size: 25px;

            opacity: 0.55;
        }


        /* =========================================
           SECTION TITLE
        ========================================= */

        .section-title {
            display: flex;

            align-items: center;

            gap: 15px;

            color: var(--text-dark);

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 30px;
        }

        .section-icon {
            width: 58px;
            height: 58px;

            min-width: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--mint-light);

            border-radius: 20px;

            font-size: 28px;
        }


        /* =========================================
           🎓 UNIVERSITY
        ========================================= */

        .university-card {
            text-align: center;

            padding: 45px 25px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f1faf7
                );

            border: 1.5px solid var(--border);

            border-radius: 35px;

            position: relative;

            overflow: hidden;
        }

        .university-card::before {
            content: "༘*.ﾟ🌷🧸";
