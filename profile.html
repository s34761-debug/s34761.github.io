<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>♡ NATCHAYAKAN | ประวัติส่วนตัว ♡</title>


    <style>

        /* =====================================================
           💚 BASIC
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: #536f68;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    #dcf8f0 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 60%,
                    #e5faf5 0%,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #f8fffd,
                    #ffffff,
                    #effbf7
                );

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =====================================================
           🌷 HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 999;

            background:
                rgba(255,255,255,0.94);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid #dcefe9;

            box-shadow:
                0 5px 25px
                rgba(76,145,130,0.08);
        }


        .navbar {

            max-width: 1250px;

            margin: auto;

            min-height: 82px;

            padding:
                12px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           ♡ LOGO
        ===================================================== */

        .logo {

            color: #4d9482;

            text-decoration: none;

            font-size: 30px;

            font-weight: 800;

            white-space: nowrap;
        }


        .logo span {

            font-size: 40px;

            font-weight: 400;
        }


        /* =====================================================
           🌿 NAV
        ===================================================== */

        nav {

            display: flex;

            gap: 5px;

            align-items: center;

            overflow-x: auto;

            scrollbar-width: none;
        }


        nav::-webkit-scrollbar {
            display: none;
        }


        nav a {

            text-decoration: none;

            color: #617973;

            font-size: 16px;

            font-weight: 700;

            padding:
                12px 18px;

            border-radius: 35px;

            white-space: nowrap;

            transition:
                0.3s ease;
        }


        nav a:hover {

            color: #438d7b;

            background:
                #e2f7f0;

            transform:
                translateY(-2px);
        }


        nav a.active {

            background:
                #c9efe4;

            color:
                #438c79;

            box-shadow:
                0 8px 20px
                rgba(83,166,145,0.12);
        }


        /* =====================================================
           💚 MAIN
        ===================================================== */

        main {

            position: relative;

            padding:
                65px 20px 90px;

            overflow: hidden;
        }


        .container {

            position: relative;

            z-index: 5;

            width:
                min(1100px, 100%);

            margin: auto;
        }


        /* =====================================================
           ✨ DECORATION
        ===================================================== */

        .decoration {

            position: absolute;

            pointer-events: none;

            user-select: none;

            opacity: 0.75;

            z-index: 1;
        }


        .deco1 {

            top: 130px;

            left: 3%;

            font-size: 50px;
        }


        .deco2 {

            top: 260px;

            right: 4%;

            font-size: 42px;
        }


        .deco3 {

            top: 700px;

            left: 4%;

            font-size: 40px;
        }


        .deco4 {

            top: 850px;

            right: 5%;

            font-size: 45px;
        }


        .deco5 {

            top: 1150px;

            left: 8%;

            font-size: 35px;
        }


        .deco6 {

            top: 1300px;

            right: 8%;

            font-size: 40px;
        }


        /* =====================================================
           ✨ PAGE TITLE
        ===================================================== */

        .page-title {

            text-align: center;

            margin-bottom: 45px;
        }


        .small-title {

            color: #75a99d;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 5px;

            margin-bottom: 10px;
        }


        .page-title h1 {

            color: #438d7b;

            font-size:
                clamp(38px, 6vw, 58px);

            font-weight: 900;

            text-shadow:
                2px 3px 0 #d8f3ec;
        }


        .page-title p {

            color: #78918b;

            font-size: 18px;

            margin-top: 10px;

            line-height: 1.8;
        }


        /* =====================================================
           🎀 DECORATIVE TOP
        ===================================================== */

        .top-decoration {

            text-align: center;

            font-size: 27px;

            letter-spacing: 5px;

            margin-bottom: 20px;

            animation:
                float 4s ease-in-out infinite;
        }


        @keyframes float {

            0%, 100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-6px);
            }
        }


        /* =====================================================
           💚 TARGET UNIVERSITY
        ===================================================== */

        .university-card {

            position: relative;

            background:
                rgba(255,255,255,0.92);

            border:
                2px solid #ccebe3;

            border-radius: 40px;

            padding:
                38px 30px;

            text-align: center;

            box-shadow:
                0 18px 40px
                rgba(75,145,130,0.10);

            overflow: hidden;

            margin-bottom: 35px;
        }


        .university-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 8px;

            background:
                linear-gradient(
                    90deg,
                    #bde9de,
                    #ffffff,
                    #bde9de
                );
        }


        .university-label {

            color: #83aaa1;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 4px;

            margin-bottom: 20px;
        }


        .university-logo {

            width: 145px;

            height: 145px;

            object-fit: contain;

            display: block;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background: white;

            padding: 8px;

            border:
                4px solid #d0eee7;

            box-shadow:
                0 10px 25px
                rgba(74,145,130,0.12);
        }


        .university-card h2 {

            color: #438d7b;

            font-size: 29px;

            margin-bottom: 5px;
        }


        .university-card p {

            color: #78918b;

            font-size: 18px;
        }


        .dream {

            display: inline-block;

            margin-top: 18px;

            padding:
                9px 20px;

            border-radius: 30px;

            background:
                #e5f8f3;

            color:
                #57988a;

            font-weight: 700;
        }


        /* =====================================================
           📝 SECTION CARD
        ===================================================== */

        .section {

            margin-bottom: 35px;
        }


        .section-title {

            text-align: center;

            margin-bottom: 20px;
        }


        .section-title h2 {

            color: #4a907f;

            font-size: 31px;

            font-weight: 850;
        }


        .section-title p {

            color: #8a9e99;

            margin-top: 5px;

            font-size: 16px;
        }


        /* =====================================================
           👤 PERSONAL INFORMATION
        ===================================================== */

        .info-card {

            background:
                rgba(255,255,255,0.93);

            border:
                2px solid #d5eee8;

            border-radius: 35px;

            padding: 30px;

            box-shadow:
                0 15px 35px
                rgba(75,145,130,0.08);
        }


        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }


        .info-item {

            display: flex;

            align-items: center;

            gap: 16px;

            padding:
                18px;

            border-radius: 23px;

            background:
                #f3fcf9;

            border:
                1px solid #e0f2ed;

            transition:
                0.3s ease;
        }


        .info-item:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px
                rgba(75,145,130,0.08);
        }


        .info-icon {

            width: 55px;

            height: 55px;

            min-width: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background:
                #ddf5ee;

            font-size: 27px;
        }


        .info-text small {

            display: block;

            color: #91a49f;

            font-size: 14px;

            margin-bottom: 4px;
        }


        .info-text strong {

            color: #425e57;

            font-size: 18px;

            line-height: 1.5;
        }


        /* =====================================================
           📚 EDUCATION
        ===================================================== */

        #education {

            scroll-margin-top: 110px;
        }


        .education-list {

            display: flex;

            flex-direction: column;

            gap: 20px;

            position: relative;
        }


        .education-list::before {

            content: "";

            position: absolute;

            left: 31px;

            top: 35px;

            bottom: 35px;

            width: 3px;

            background:
                #c7e9e0;

            border-radius: 10px;
        }


        .education-card {

            position: relative;

            display: flex;

            gap: 22px;

            align-items: flex-start;

            background:
                rgba(255,255,255,0.95);

            border:
                2px solid #d4eee8;

            border-radius: 30px;

            padding:
                25px;

            margin-left: 0;

            box-shadow:
                0 12px 30px
                rgba(76,145,130,0.07);

            transition:
                0.3s ease;
        }


        .education-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 18px 35px
                rgba(76,145,130,0.11);
        }


        .education-icon {

            position: relative;

            z-index: 2;

            width: 65px;

            height: 65px;

            min-width: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #dff6ef;

                5px solid
